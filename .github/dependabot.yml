version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 30
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /.dagger
    cooldown:
      default-days: 30
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
