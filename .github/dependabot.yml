version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 30
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /.dagger
    cooldown:
      default-days: 30
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      # .dagger deps follow the Dagger engine SDK. otel >= 1.47 requires
      # dagger/otel-go with the otel/log v1 API; refresh via `just update-deps`
      # after bumping dagger.json.
      - dependency-name: "go.opentelemetry.io/otel*"
      - dependency-name: "github.com/dagger/otel-go"
