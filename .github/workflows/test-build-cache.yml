name: Test build cache

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (empty for all)"
        required: false
        type: string
        default: ""
      version:
        description: "Version tag for testing"
        required: false
        type: string
        default: "nightly"

env:
  DAGGER_NO_NAG: "1"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  test-cache-creation:
    name: Test build cache creation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build with cache
        uses: memospot/action-dagger@373c5782d0daec4437049d9b1c87f4c37b534324 # v1.0.2
        with:
          cache-mode: direct
          version: latest
          verb: call
          args: >-
            build
            --source .
            --version ${{ inputs.version }}
            --platforms "${{ inputs.platforms }}"
        env:
          DAGGER_CLOUD_TOKEN: "${{ secrets.DAGGER_CLOUD_TOKEN }}"

      - name: Report cache status
        run: |
          echo "Build completed."
          echo ""

  test-usage:
    needs: test-cache-creation
    name: Test build cache usage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build with cache
        uses: memospot/action-dagger@373c5782d0daec4437049d9b1c87f4c37b534324 # v1.0.2
        with:
          cache-mode: direct
          version: latest
          verb: call
          args: >-
            build
            --source .
            --version ${{ inputs.version }}
            --platforms "${{ inputs.platforms }}"
        env:
          DAGGER_CLOUD_TOKEN: "${{ secrets.DAGGER_CLOUD_TOKEN }}"

      - name: Report cache status
        run: |
          echo "Build completed."
          echo ""
