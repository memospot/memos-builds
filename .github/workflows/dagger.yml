name: Build and Release (Dagger)

on:
  schedule:
    - cron: "25 7 * * *" # Daily dev build at 7:25 AM UTC
  push:
    tags:
      - "v0.[0-9]+.[0-9]+*"
      - "[1-9][0-9].*"
  workflow_dispatch:
    inputs:
      version:
        description: |
          Version tag to build (e.g., 26.10.0, 26.10.15-dev.1511fd1, v0.25.3).
          Leave empty for a dev build from main branch.
        required: false
        type: string
      publish-containers:
        description: "Publish containers to registries"
        required: false
        type: boolean
        default: true

env:
  DAGGER_NO_NAG: "1"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [[ -z "${INPUTS_VERSION}" ]]; then
            if [[ "${GITHUB_REF_NAME}" == v* || "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              VERSION="${GITHUB_REF_NAME}"
            else
              read -r MEMOS_SHA _ <<<"$(git ls-remote https://github.com/usememos/memos.git refs/heads/main)"
              MEMOS_SHA="${MEMOS_SHA:0:7}"
              if [[ -z "$MEMOS_SHA" ]]; then
                echo "Failed to resolve usememos/memos main branch SHA" >&2
                exit 1
              fi
              # Dev version mirrors upstream: YY.MM.D-dev.<sha7>, matching
              # internal/version and scripts/release_version.sh. The date is the
              # build date in UTC; the embedded binary carries the same scheme.
              VERSION="$(TZ=UTC date +%y.%m.%-d)-dev.${MEMOS_SHA,,}"
            fi
          elif [[ "${INPUTS_VERSION}" =~ ^(v?0\.[0-9]+\.[0-9]+|v?[1-9][0-9]\.(0[1-9]|1[0-2])(\.[0-9]+)?(-rc\.[1-9][0-9]*)?|v?[1-9][0-9]\.(0[1-9]|1[0-2])\.[0-9]+-dev\.[0-9a-f]{7}|[0-9a-fA-F]{40})$ ]]; then
            VERSION="${INPUTS_VERSION}"
          else
            echo "Invalid version ${INPUTS_VERSION}: expected a release tag, dev version, or commit hash" >&2
            exit 1
          fi

          # Normalise calendar tags to upstream's bare form (26.10.0);
          # legacy v0.x tags keep the "v" prefix.
          if [[ "$VERSION" =~ ^v[1-9][0-9]+\.(0[1-9]|1[0-2])(\.[0-9]+)?(-rc\.[1-9][0-9]*)?$ || "$VERSION" =~ ^v[1-9][0-9]+\.(0[1-9]|1[0-2])\.[0-9]+-dev\.[0-9a-f]{7}$ ]]; then
            VERSION="${VERSION#v}"
          fi

          if [[ "$VERSION" == v* ]]; then
            CONTAINER_TAG="${VERSION#v}"
          else
            CONTAINER_TAG="$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "container_tag=$CONTAINER_TAG" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Determine publish args
        id: publish
        run: |
          HAS_DOCKER="${{ secrets.DOCKER_TOKEN != '' }}"
          HAS_GHCR="${{ secrets.GHCR_TOKEN != '' }}"

          if ([ "${{ inputs.publish-containers }}" = "true" ] && [ "$HAS_DOCKER" = "true" ] && [ "$HAS_GHCR" = "true" ]) || \
              [ "${{ github.event_name }}" = "push" ] || \
              [ "${{ github.event_name }}" = "schedule" ]; then
            echo "args=--docker-hub-user lincolnthalles --docker-hub-password env:DOCKER_TOKEN --ghcr-user ${GITHUB_ACTOR} --ghcr-password env:GHCR_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Build release artifacts
        uses: memospot/action-dagger@373c5782d0daec4437049d9b1c87f4c37b534324 # v1.0.2
        with:
          version: latest
          verb: call
          args: >-
            publish
            --source .
            --version ${{ steps.version.outputs.version }}
            ${{ steps.publish.outputs.args }}
            export --path ./dist
        env:
          DAGGER_CLOUD_TOKEN: "${{ secrets.DAGGER_CLOUD_TOKEN }}"
          DOCKER_TOKEN: "${{ secrets.DOCKER_TOKEN }}"
          GHCR_TOKEN: "${{ secrets.GHCR_TOKEN }}"

      - name: List build artifacts
        run: ls -la ./dist

      - name: Attest binary artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "./dist/*"

      - name: Get GHCR image digest
        id: container-digest
        if: steps.publish.outputs.args != ''
        run: |
          DIGEST=$(jq -r '.[] | select(.registry | startswith("ghcr.io")) | .digest' ./dist/container-digests.json | head -1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.container-digest.outputs.digest != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Attest container image
        if: steps.container-digest.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/memospot/memos-builds
          subject-digest: ${{ steps.container-digest.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        if: startsWith(steps.version.outputs.version, 'v0.') || (!startsWith(steps.version.outputs.version, 'v') && !contains(steps.version.outputs.version, '-rc.') && !contains(steps.version.outputs.version, '-dev.') && contains(steps.version.outputs.version, '.'))
        run: |
          # Remove existing release if present (workflow re-runs).
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            gh release delete "${VERSION}" --yes --cleanup-tag
          fi

          cat <<'NOTES' | envsubst > /tmp/release-notes.md
          Built from [usememos/memos@${VERSION}](https://github.com/usememos/memos/releases/tag/${VERSION})

          ---
          ```bash
          docker pull ghcr.io/memospot/memos-builds:${CONTAINER_TAG}
          ```
          ```bash
          docker pull docker.io/lincolnthalles/memos:${CONTAINER_TAG}
          ```
          NOTES
          gh release create "${VERSION}" ./dist/* \
            --title "${VERSION}" \
            --latest \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CONTAINER_TAG: ${{ steps.version.outputs.container_tag }}

      - name: Create Dev Release
        if: contains(steps.version.outputs.version, '-dev.')
        run: |
          # Remove existing release if present (workflow re-runs, same-day rebuilds).
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            gh release delete "${VERSION}" --yes --cleanup-tag
          fi

          cat <<'NOTES' | envsubst > /tmp/release-notes.md
          Built from [usememos/memos@main](https://github.com/usememos/memos/commits/main/).

          > [!WARNING]
          > **This is an automated development build and may be unstable, or may not even run at all.**

          > [!CAUTION]
          > Ensure that you use a different database from the one you use for stable releases.

          > [!NOTE]
          > Dev binaries embed an upstream-style development version
          > (for example, `26.10.15-dev.1511fd1`).

          ---

          ## Docker

          ### Starting a throwaway instance
          No data persistence, everything gets deleted when the container is stopped.

          ```bash
          docker run --detach --rm --name memos-${CONTAINER_TAG}-throwaway --publish 5232:5230 \
            --env MEMOS_DEMO=true ghcr.io/memospot/memos-builds:${CONTAINER_TAG}
          ```
          The container should be accessible at <http://localhost:5232/>.

          ### Stopping the instance
          ```bash
          docker stop memos-${CONTAINER_TAG}-throwaway
          ```
          NOTES
          gh release create "${VERSION}" ./dist/* \
            --title "${VERSION}" \
            --prerelease \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_TAG: ${{ steps.version.outputs.container_tag }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create Release Candidate Release
        if: contains(steps.version.outputs.version, '-rc.')
        run: |
          # Remove existing release if present (workflow re-runs).
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            gh release delete "${VERSION}" --yes --cleanup-tag
          fi

          cat <<'NOTES' | envsubst > /tmp/release-notes.md
          Built from [usememos/memos@${VERSION}](https://github.com/usememos/memos/releases/tag/${VERSION})

          ---
          ```bash
          docker pull ghcr.io/memospot/memos-builds:${CONTAINER_TAG}
          ```
          ```bash
          docker pull docker.io/lincolnthalles/memos:${CONTAINER_TAG}
          ```
          NOTES
          gh release create "${VERSION}" ./dist/* \
            --title "${VERSION}" \
            --prerelease \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_TAG: ${{ steps.version.outputs.container_tag }}
          VERSION: ${{ steps.version.outputs.version }}
