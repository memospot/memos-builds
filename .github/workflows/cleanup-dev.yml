name: Cleanup dev releases

on:
  schedule:
    - cron: "25 6 * * *" # Daily dev-image cleanup at 6:25 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prune old ghcr.io dev images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          delete-tags: "*-dev.*"
          older-than: 7 days
          delete-untagged: true

      - name: Prune orphaned GHCR attestation manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          package: memos-builds
          delete-tags: sha256-*
          older-than: 7 days

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune old dev releases
        run: |
          cutoff_days=7
          cutoff_date=$(date -u -d "-${cutoff_days} days" +%F)

          start_time=$(date +%s)

          # Dev releases carry the build date in the tag (YY.MM.D-dev.<sha7>),
          # but the GitHub release timestamp is authoritative: the tag date is
          # the build date, the release may be re-created later by re-runs.
          readarray -t tags < <(gh release list --limit 100 --json tagName,publishedAt \
            --jq --arg cutoff "$cutoff_date" '.[] | select(.tagName | test("^[1-9][0-9]\\.[0-9]+\\.[0-9]+-dev\\.[0-9a-f]{7}$")) | select(.publishedAt < $cutoff) | .tagName')

          total=${#tags[@]}
          deleted=0
          declare -A tag_status

          for tag in "${tags[@]}"; do
            echo "Deleting release: $tag"
            if gh release delete "$tag" --yes --cleanup-tag; then
              deleted=$((deleted + 1))
              tag_status["$tag"]="✅ Deleted"
            else
              tag_status["$tag"]="❌ Failed"
            fi
          done

          end_time=$(date +%s)
          duration=$((end_time - start_time))

          {
            echo "---"
            echo "<h1>🧹 Dev Release Cleanup Summary</h1>"
            echo "<h2>Overview</h2>"
            echo "<table><tr><th>Metric</th><th>Value</th></tr>"
            echo "<tr><td>Releases with tag age &gt;= ${cutoff_days} days</td><td>${total}</td></tr>"
            echo "<tr><td>Releases deleted</td><td>${deleted}</td></tr>"
            echo "<tr><td>Duration</td><td>${duration}s</td></tr>"
            echo "</table>"
            echo "<details><summary>Configuration</summary>"
            echo "<table><tr><th>Key</th><th>Value</th></tr>"
            echo "<tr><td>cutoff-days</td><td>${cutoff_days}</td></tr>"
            echo "<tr><td>cutoff-date</td><td>${cutoff_date}</td></tr>"
            echo "<tr><td>limit</td><td>100</td></tr>"
            echo "<tr><td>tag-pattern</td><td>YY.MM.D-dev.sha7</td></tr>"
            echo "</table></details>"
            echo "<h2>Results</h2>"
            if [ "${total}" -eq 0 ]; then
              echo "<p>No old dev releases found.</p>"
            else
              echo "<table><tr><th>Tag</th><th>Status</th></tr>"
              for tag in "${tags[@]}"; do
                echo "<tr><td>${tag}</td><td>${tag_status[$tag]}</td></tr>"
              done
              echo "</table>"
            fi
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
